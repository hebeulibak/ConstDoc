{% extends "base.html" %}

{% block title %}Отчёты - {{ site.name }}{% endblock %}

{% block extra_css %}
<style>
    .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 10px 20px;
        border-radius: 40px;
        text-decoration: none;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        transition: all 0.3s;
        cursor: pointer;
    }
    
    .back-button:hover {
        transform: translateX(-5px);
        border-color: var(--accent);
    }
    
    .btn-outline-premium {
        background: transparent;
        border: 2px solid var(--primary);
        color: var(--primary);
        padding: 10px 24px;
        border-radius: 40px;
        transition: all 0.2s;
    }
    
    .btn-outline-premium:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="mb-4">
        <a href="javascript:void(0);" onclick="goBack()" class="back-button">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
    </div>
    
    <h2><i class="fas fa-chart-bar" style="color: var(--accent);"></i> Отчёты по объекту</h2>
    
    <div class="row mt-4">
        <div class="col-md-6 mb-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <i class="fas fa-file-excel fa-4x mb-3" style="color: #28a745;"></i>
                    <h5>Экспорт журнала работ</h5>
                    <p class="text-muted">Выгрузить все записи в Excel</p>
                    <button class="btn btn-premium" onclick="window.location.href='/export-journal/{{ site.id }}'">
                        <i class="fas fa-download"></i> Экспорт
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card text-center h-100">
                <div class="card-body">
                    <i class="fas fa-chart-line fa-4x mb-3" style="color: var(--accent);"></i>
                    <h5>Сводный отчёт</h5>
                    <p class="text-muted">Общая статистика по объекту</p>
                    <button class="btn btn-outline-premium" onclick="alert('Функция в разработке')">
                        <i class="fas fa-chart-pie"></i> Сформировать
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Функция умного возврата
    function goBack() {
        if (document.referrer && document.referrer !== window.location.href) {
            window.history.back();
        } else {
            window.location.href = "{{ url_for('index') }}";
        }
    }
</script>
{% endblock %}
