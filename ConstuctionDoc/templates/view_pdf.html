{% extends "base.html" %}

{% block title %}Просмотр: {{ doc.title }}{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('documents_section', site_id=doc.site_id, section=doc.section) }}" class="btn btn-secondary">
        ← Назад к документам
    </a>
    <a href="{{ file_url }}" class="btn btn-primary" download>⬇️ Скачать PDF</a>
</div>
<div style="height: 80vh;">
    <embed src="{{ file_url }}" type="application/pdf" width="100%" height="100%">
</div>
{% endblock %}
