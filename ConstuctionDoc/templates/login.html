{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg" data-aos="fade-up">
            <div class="card-header bg-primary text-white text-center py-3">
                <i class="fas fa-hard-hat fa-2x mb-2"></i>
                <h4 class="mb-0">СтройДок</h4>
                <small>Вход в систему</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Имя пользователя
                        </label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Пароль
                        </label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100 py-2">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </button>
                </form>
                <hr>
                <div class="text-center text-muted small">
                    <i class="fas fa-info-circle"></i> Тестовый доступ: admin / admin123
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
